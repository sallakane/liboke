# Configuration globale du site. Lue par App\Content\SiteConfig,
# exposée à Twig sous la variable « site ».

name: "Association LIBOKÉ"
# Reprise du logo de l'association.
baseline: "Éducation · Environnement · Santé"

# Téléphone laissé vide : le seul numéro connu (biographie du fondateur) est
# un portable, sa publication reste à confirmer par l'association.
contact:
  email: "association.liboke@gmail.com"
  telephone: ""
  adresse: "115 chemin de Lanusse, 31200 Toulouse, France"

# Liens fournis par l'association le 2026-09-27 (le lien de partage Facebook
# redirige vers la page Association.LBK). Plus de compte Twitter.
reseaux:
  - { label: "Facebook",  href: "https://www.facebook.com/Association.LBK",       icone: "icone_Facebook.svg" }
  - { label: "Instagram", href: "https://www.instagram.com/association_lbk/",     icone: "icone_Instagram.svg" }
  - { label: "YouTube",   href: "https://www.youtube.com/@associationliboke6174", icone: "icone_YouTube.svg" }

# Cartes « Nos engagements » de la page d'accueil.
# icone : education, environnement ou sante (dessins dans
# templates/home/_icone.html.twig).
engagements:
  - titre: "Éducation"
    icone: education
    texte: "Accompagner les enfants vulnérables, notamment les orphelins, vers l'école, et équiper les classes grâce aux ardoises de l'espoir fabriquées par des personnes vivant avec un handicap."
  - titre: "Environnement"
    icone: environnement
    texte: "Mobiliser les habitants contre l'insalubrité et soutenir une coopérative agricole de femmes qui valorise les productions locales et renforce leur autonomie."
  - titre: "Santé"
    icone: sante
    texte: "Faciliter l'accès des femmes et des jeunes filles à la santé grâce à la carte de maternité et à la carte d'hygiène féminine, et mener des actions de prévention."

# Le menu principal est déduit du front matter des pages (clé « menu »).
# Le pied de page, lui, liste explicitement les pages légales.
pied:
  liens:
    - { label: "Mentions légales",              href: "/mentions-legales" }
    - { label: "Politique de confidentialité",  href: "/politique-de-confidentialite" }
