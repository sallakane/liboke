security:
    # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    # Un seul compte, lu dans ADMIN_USERNAME / ADMIN_PASSWORD_HASH
    # (CLAUDE.md §10). Aucune table `user`.
    providers:
        admin:
            id: App\Security\AdminUserProvider

    firewalls:
        dev:
            # Ensure dev tools and static assets are always allowed
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false

        # Seul /admin est protégé. Le reste du site, et en particulier
        # /stripe/webhook, n'est couvert par aucun pare-feu (CLAUDE.md §10,
        # règle 5) : aucune session n'y est ouverte, les pages restent
        # cachables.
        admin:
            pattern: ^/admin
            lazy: true
            provider: admin
            form_login:
                login_path: app_admin_login
                check_path: app_admin_login
                default_target_path: app_admin_donations
                always_use_default_target_path: false
                enable_csrf: true
            logout:
                path: app_admin_logout
                target: app_home
            # Compteur en cache, par identifiant et par IP : rien en base
            # (CLAUDE.md §11).
            login_throttling:
                max_attempts: 5
                interval: '15 minutes'

    # Note: Only the *first* matching rule is applied
    #
    # HTTPS obligatoire sur /admin (CLAUDE.md §10). Le schéma est paramétrable
    # uniquement pour les tests, dont le client émet en http.
    access_control:
        - { path: ^/admin/connexion$, roles: PUBLIC_ACCESS, requires_channel: '%env(ADMIN_REQUIRED_SCHEME)%' }
        - { path: ^/admin, roles: ROLE_ADMIN, requires_channel: '%env(ADMIN_REQUIRED_SCHEME)%' }

when@test:
    security:
        password_hashers:
            # Password hashers are resource-intensive by design to ensure security.
            # In tests, it's safe to reduce their cost to improve performance.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
